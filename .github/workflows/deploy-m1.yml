name: Deploy M1

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_migrations:
        description: Apply pending Supabase migrations even when this commit has no migration changes
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-m1-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify application and worker
        run: |
          npm ci
          npm run build
          npm run lint
          python -m py_compile worker/worker.py worker/distributor.py

      - name: Detect Supabase migrations
        id: migrations
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- supabase/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Supabase migrations
        if: steps.migrations.outputs.changed == 'true' || inputs.force_migrations == true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || {
            echo "SUPABASE_DB_URL is required when migrations change."
            exit 1
          }
          npx supabase@2.116.0 db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Wait for Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..60}; do
            deployment_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=Production" \
              --jq '.[0].id // empty')"
            if [[ -n "$deployment_id" ]]; then
              state="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                --jq '.[0].state // empty')"
              [[ "$state" == "success" ]] && exit 0
              [[ "$state" == "failure" || "$state" == "error" ]] && exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel production."
          exit 1

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::874518807041:role/video-speed-reader-github-deploy
          aws-region: ap-southeast-1
          retry-max-attempts: 2

      - name: Deploy worker through SSM
        shell: bash
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids i-0f78c242f30c84f93 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["set -eu","cd /home/ubuntu/app","runuser -u ubuntu -- git pull --ff-only origin main","/home/ubuntu/app/worker/venv/bin/pip install -r /home/ubuntu/app/worker/requirements.txt --quiet","install -m 0644 /home/ubuntu/app/worker/m1-distributor.service /etc/systemd/system/m1-distributor.service","systemctl daemon-reload","systemctl restart m1-distributor.service","sleep 3","systemctl is-active m1-distributor.service","systemctl is-enabled m1-distributor.service","runuser -u ubuntu -- git rev-parse HEAD"]' \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id i-0f78c242f30c84f93
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id i-0f78c242f30c84f93 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
